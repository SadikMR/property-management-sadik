{% extends "base.html" %}

{% block content %}

<h1>Property Search</h1>

<form
    action="{% url 'property_list' %}"
    method="get"
>
    <input
        type="text"
        name="location"
        placeholder="Enter city or location"
    >

    <button type="submit">
        Search
    </button>
</form>

{% endblock %}
